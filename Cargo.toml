[package]
name = "try"
version = "0.8.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "A little practice, now and then."
license = "MIT"

[features]
native_checks = []
portable = []
distribution = []

[[example]]
name = "update_driver"
path = "tests/fixtures/update_driver.rs"
required-features = ["native_checks", "distribution"]

[workspace]
resolver = "3"

[workspace.dependencies]
slint-math-input = { git = "https://github.com/Ethan-decoy/slint_math_input.git", rev = "9d7290057cda3c0005450c35ac878d992ca761ba", default-features = false }

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "system-tray", "compat-1-18", "unstable-winit-030"] }
slint-math-input = { workspace = true, features = ["slint-ui"] }
arboard = { version = "=3.6.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
base64 = "=0.23.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
sys-locale = "=0.3.2"
semver = "=1.0.28"
webbrowser = "=1.2.4"
rand = "0.9"
directories = "6"
tempfile = "3"
log = "0.4"
flexi_logger = { version = "=0.31.10", default-features = false }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "pollster"] }
latex-rust = { version = "=2.1.0", default-features = false }
resvg = { version = "=0.48.1", default-features = false }
roxmltree = "=0.21.1"
zip = { version = "=9.0.3", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Networking_WinHttp", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
libc = "0.2"
ureq = { version = "=3.4.2", default-features = false, features = ["native-tls"] }

[build-dependencies]
slint-math-input = { workspace = true }
serde_json = "1"
latex-rust = { version = "=2.1.0", default-features = false }
slint-build = { version = "=1.18.1", default-features = false, features = ["compat-1-18"] }
resvg = { version = "=0.48.1", default-features = false }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
